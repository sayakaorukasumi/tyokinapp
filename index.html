<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>さやの貯金アプリ</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="さやの貯金" />
  <meta name="theme-color" content="#f5a3b6" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="app-title">さやの貯金アプリ</h1>
  </header>

  <main>
    <!-- ===================== ホーム ===================== -->
    <section class="tab-page active" id="page-home">
      <div class="card stage-card">
        <div class="stage-image" id="stage-image"><!-- JSで描画 --></div>
        <h2 class="stage-title" id="stage-title">—</h2>
        <p class="stage-message" id="stage-message"></p>
      </div>

      <div class="card progress-card">
        <div class="amount-row">
          <span class="amount-current" id="amount-current">¥0</span>
        </div>
        <div class="amount-goal-row">
          目標 <span id="amount-goal">¥0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-meta">
          <span id="progress-percent">0%</span>
          <span id="progress-remain"></span>
        </p>
      </div>
    </section>

    <!-- ===================== 記録 ===================== -->
    <section class="tab-page" id="page-record">
      <div class="card input-card">
        <h2 class="card-title">入金を記録</h2>
        <label class="field">
          <span class="field-label">入金額</span>
          <div class="field-input">
            <span class="yen">¥</span>
            <input type="number" id="input-amount" inputmode="numeric" min="1" step="1" placeholder="0" />
          </div>
        </label>

        <div class="quick-buttons" id="quick-buttons">
          <button type="button" class="quick-btn" data-amount="5000">＋5,000</button>
          <button type="button" class="quick-btn" data-amount="10000">＋10,000</button>
          <button type="button" class="quick-btn" data-amount="30000">＋30,000</button>
          <button type="button" class="quick-btn" data-amount="50000">＋50,000</button>
        </div>

        <label class="field">
          <span class="field-label">メモ（任意）</span>
          <div class="field-input">
            <input type="text" id="input-memo" maxlength="40" placeholder="おこづかい・ボーナス など" />
          </div>
        </label>

        <button class="primary-btn" id="add-btn">追加する</button>
        <p class="saved-note" id="saved-note"></p>
      </div>

      <div class="card history-card">
        <div class="history-head">
          <h2 class="card-title">入金履歴</h2>
          <span class="history-total" id="history-total">合計 ¥0</span>
        </div>
        <ul class="history-list" id="history-list"><!-- JSで描画 --></ul>
        <p class="empty-note" id="history-empty">まだ入金記録がありません。</p>
      </div>
    </section>

    <!-- ===================== 設定 ===================== -->
    <section class="tab-page" id="page-settings">
      <div class="card">
        <h2 class="card-title">設定</h2>
        <label class="field">
          <span class="field-label">貯金タイトル</span>
          <div class="field-input">
            <input type="text" id="input-title" maxlength="20" placeholder="さやの貯金アプリ" />
          </div>
        </label>

        <label class="field">
          <span class="field-label">目標金額</span>
          <div class="field-input">
            <span class="yen">¥</span>
            <input type="number" id="input-goal" inputmode="numeric" min="1" step="1" placeholder="100000" />
          </div>
        </label>

        <button class="primary-btn" id="save-settings-btn">設定を保存</button>
        <p class="saved-note" id="settings-note"></p>
      </div>

      <div class="card danger-card">
        <h2 class="card-title">データリセット</h2>
        <p class="danger-text">入金履歴・目標金額・タイトルをすべて削除して初期状態に戻します。</p>
        <button class="danger-btn" id="reset-btn">すべてのデータを削除</button>
      </div>
    </section>
  </main>

  <!-- ===================== タブバー ===================== -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-item active" data-tab="home">
      <span class="tab-icon">🏠</span><span class="tab-label">ホーム</span>
    </button>
    <button class="tab-item" data-tab="record">
      <span class="tab-icon">✏️</span><span class="tab-label">記録</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <span class="tab-icon">⚙️</span><span class="tab-label">設定</span>
    </button>
  </nav>

  <script src="stages.js"></script>
  <script src="app.js"></script>
</body>
</html>
